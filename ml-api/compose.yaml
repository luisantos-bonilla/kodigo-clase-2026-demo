services:
  api:
    build: .
    image: ml-api:local
    # Accesible desde otros equipos de la red; /predict exige API Key.
    # Para limitarlo a este equipo: BIND_ADDRESS=127.0.0.1
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8000}:8080"
    environment:
      API_KEY: ${API_KEY:?Defina API_KEY en el archivo .env}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-10240}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
      HOST: 0.0.0.0
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
